.font-cinzel {

.font-medievalsharp {

/* Custom Scrollbar */
::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

::-webkit-scrollbar-track {
    background: #f3f4f6;
}

::-webkit-scrollbar-thumb {
    background: #92400e;
    border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
    background: #78350f;
}

/* Item Card Styles */
.item-card {
    transition: all 0.3s ease;
    transform: translateY(0);
}

.item-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
}

/* Material Card Styles */
.material-card {
    background: rgba(254, 243, 199, 0.7);
    border: 1px solid #92400e;
    transition: all 0.3s ease;
}

.material-card:hover {
    background: rgba(254, 243, 199, 0.9);
    box-shadow: 0 4px 8px rgba(146, 64, 14, 0.2);
}

/* Form Input Styles */
input, select, textarea {
    transition: all 0.2s ease;
}

input:focus, select:focus, textarea:focus {
    outline: none;
    box-shadow: 0 0 0 2px rgba(180, 83, 9, 0.5);
}

/* Responsive Adjustments */
@media (max-width: 768px) {
    .crafting-grid {
        grid-template-columns: 1fr;
    }
    
    .material-grid {
        grid-template-columns: 1fr;
    }
}
  </style>
</head>
<body class="bg-amber-50 font-cinzel">
    <!-- Main Container -->

  <script>

    function calculateFinalDamage(baseDamage, materialBonus) {
    if (materialBonus === '+0') return baseDamage;
      const baseMatch = baseDamage.match(/(\d+)D(\d+)/);
    const bonusMatch = materialBonus.match(/(\d+)D(\d+)/);
    
    if (!baseMatch || !bonusMatch) {
       return `${baseDamage} ${materialBonus}`;
    }
    
    const baseDice = parseInt(baseMatch[1]);
    const baseSides = parseInt(baseMatch[2]);
    const bonusDice = parseInt(bonusMatch[1]);
    const bonusSides = parseInt(bonusMatch[2]);
    const totalDice = baseDice + bonusDice;
    
   
    const totalSides = Math.max(baseSides, bonusSides);
    
    return `${totalDice}D${totalSides}`;
}


function calculateFinalWeight(baseWeight, materialBonus) {
    if (materialBonus === '+0') return baseWeight;
    
    const baseValue = parseFloat(baseWeight);
    const bonusValue = parseFloat(materialBonus.replace('+', ''));
    
    return `${baseValue + bonusValue}kg`;
}


function calculateFinalValue(baseValue, materialBonus) {
    if (materialBonus === '+0') return baseValue;
    
    const baseNum = parseFloat(baseValue);
    const bonusNum = parseFloat(materialBonus.replace('+', '').replace('D$', ''));
    
    return `${baseNum + bonusNum}D$`;
}
    const items = {

        { id: 3, name: "Espada Longa", damage: "2d4", weight: "4kg", value: "150D$", description: "Espada versátil para vários estilos de combate." },
        { id: 4, name: "Espada Grande", damage: "2D6", weight: "6kg", value: "250D$", description: "Espada pesada para golpes poderosos." },
        { id: 5, name: "Machado", damage: "1D4", weight: "4kg", value: "80D$", description: "Machado para combate e trabalho." },

        { id: 9, name: "Lança", damage: "1D4", weight: "3kg", value: "70D$", description: "Lança versátil para várias situações." }
    ],

        { id: 11, name: "Cajado", damage: "1D6", weight: "2kg", value: "500D$", description: "Cajado para magos experientes." },
        { id: 12, name: "Baralho de Tarot", damage: "1D4", weight: "1kg", value: "400D$", description: "Baralho místico para adivinhação." }
    ],
    defense: [
        { id: 13, name: "Armadura Leve", damage: "+1 AC", weight: "5kg", value: "200D$", description: "Armadura flexível para mobilidade, adiciona metade do bonus de dex no CA, mas ataques perfurantes possuem vantagem." },
        { id: 14, name: "Armadura Média", damage: "+3 AC", weight: "10kg", value: "400D$", description: "Armadura balanceada para proteção, adiciona a média do bonus de força e de dex, mas ataques perfurantes possuem vantagem." },
        { id: 15, name: "Armadura Pesada", damage: "+5 AC", weight: "20kg", value: "800D$", description: "Armadura completa para máxima proteção, adiciona metade do bonus de força no CA, mas ataques esmagadores possuem vantagem.." },
        { id: 16, name: "Escudo", damage: "+2 AC", weight: "6kg", value: "150D$", description: "Escudo para defesa em combate." }

// Base materials data
const baseMaterials = {

        { id: 1, name: "Ferro", damage: "+2", weight: "+1kg", value: "+50D$", description: "Material básico para armas." },
        { id: 2, name: "Aço", damage: "+2", weight: "+1kg", value: "+100D$", description: "Material resistente para armas." }
        { id: 3, name: "Aço", damage: "+2", weight: "+1kg", value: "+100D$", description: "Material resistente para armas." }
    ],
    defense: [
        { id: 10, name: "Couro", damage: "+1", weight: "+2kg", value: "+50D$", description: "Material leve para armaduras." },
        { id: 11, name: "Cota de Malha", damage: "+2", weight: "+5kg", value: "+150D$", description: "Material balanceado para proteção." },
        { id: 12, name: "Placas de aço", damage: "+3", weight: "+10kg", value: "+300D$", description: "Material pesado para máxima proteção." }
    ],

        { id: 20, name: "Carvalho", damage: "+1D2", weight: "+0.5kg", value: "+200D$", description: "Madeira sólida para itens mágicos." },
        { id: 21, name: "Ébano", damage: "+1D4", weight: "+1kg", value: "+600D$", description: "Madeira rara para itens poderosos." },
        { id: 22, name: "Cristal", damage: "+1D6", weight: "+0.5kg", value: "+800D$", description: "Material arcano para itens mágicos." }
    ]
};

// Initialize the app
document.addEventListener('DOMContentLoaded', function() {
    // Load custom materials from localStorage
    const customMaterials = JSON.parse(localStorage.getItem('customMaterials')) || {};
    
    // Merge base materials with custom ones
    const allMaterials = {
        weapons: [...baseMaterials.weapons, ...(customMaterials.weapons || [])],
        defense: [...baseMaterials.defense, ...(customMaterials.defense || [])],
        magic: [...baseMaterials.magic, ...(customMaterials.magic || [])]
    };
    
    // Render all items
    renderItems('weapons', items.weapons, allMaterials.weapons);
    renderItems('magic', items.magic, allMaterials.magic);
    renderItems('defense', items.defense, allMaterials.defense);
    
    // Render all materials
    renderMaterials(allMaterials);
    
    // Setup form submission
    document.getElementById('add-material-form').addEventListener('submit', function(e) {
        e.preventDefault();
        addNewMaterial(allMaterials);
    });
});

// Render items for a category
function renderItems(category, items, materials) {
    const container = document.getElementById(`${category}-container`);
    container.innerHTML = '';
    
    items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card bg-amber-100 p-4 rounded-lg border border-amber-700 shadow-md';
        
        // Create material options
        const materialOptions = materials.map(material => 
            `<option value="${material.id}">${material.name}</option>`
        ).join('');
        
        card.innerHTML = `
            <h3 class="text-xl font-bold text-amber-900 mb-2">${item.name}</h3>
            <div class="text-amber-800 mb-3">
                <p><span class="font-semibold">Dano:</span> ${item.damage}</p>
                <p><span class="font-semibold">Peso:</span> ${item.weight}</p>
                <p><span class="font-semibold">Valor:</span> ${item.value}</p>
                <p class="text-sm italic">${item.description}</p>
            </div>
            
            <div class="mb-3">
                <label class="block text-amber-900 mb-1">Material</label>
                <select class="material-select w-full px-3 py-1 rounded border border-amber-700 bg-amber-50" 
                        data-item-id="${item.id}" 
                        onchange="updateFinalAttributes(this)">
                    <option value="">-- Selecionar --</option>
                    ${materialOptions}
                </select>
            </div>
            
            <div class="final-attributes bg-amber-200/50 p-3 rounded border border-amber-600 hidden">
                <h4 class="font-semibold text-amber-900 mb-1">Atributos Finais</h4>
                <p><span class="font-semibold">Dano:</span> <span class="final-damage">${item.damage}</span></p>
                <p><span class="font-semibold">Peso:</span> <span class="final-weight">${item.weight}</span></p>
                <p><span class="font-semibold">Valor:</span> <span class="final-value">${item.value}</span></p>
            </div>
            
            <button class="craft-btn w-full mt-3 px-4 py-2 bg-amber-800 text-amber-50 rounded hover:bg-amber-700 opacity-50 cursor-not-allowed">
                forjar
            </button>
        `;
        
        container.appendChild(card);
    });
}

// Render all materials
function renderMaterials(materials) {
    const container = document.getElementById('materials-list');
    container.innerHTML = '';
    
    // Combine all materials
    const allMaterials = [...materials.weapons, ...materials.defense, ...materials.magic];
    
    allMaterials.forEach(material => {
        const card = document.createElement('div');
        card.className = 'material-card p-4 rounded-lg';
        
        let category;
        if (materials.weapons.includes(material)) category = "Armas";
        else if (materials.defense.includes(material)) category = "Armaduras";
        else category = "Mágicos";
        
        card.innerHTML = `
            <h3 class="text-lg font-bold text-amber-900">${material.name}</h3>
            <p class="text-sm text-amber-700 mb-1">Categoria: ${category}</p>
            <p class="text-sm"><span class="font-semibold">Bônus de Dano:</span> ${material.damage}</p>
            <p class="text-sm"><span class="font-semibold">Bônus de Peso:</span> ${material.weight}</p>
            <p class="text-sm"><span class="font-semibold">Bônus de Valor:</span> ${material.value}</p>
            <p class="text-xs italic mt-2">${material.description}</p>
        `;
        
        container.appendChild(card);
    });
}

// Update final attributes when material is selected
function updateFinalAttributes(selectElement) {
    const itemId = parseInt(selectElement.dataset.itemId);
    const materialId = parseInt(selectElement.value);
    const card = selectElement.closest('.item-card');
    const finalAttributes = card.querySelector('.final-attributes');
    
  
    if (!materialId) {
        finalAttributes.classList.add('hidden');
        return;
    }
    
  
    let item;
    let materials;
    
    if (itemId <= 9) { 
        item = items.weapons.find(i => i.id === itemId);
        materials = [...baseMaterials.weapons, ...(JSON.parse(localStorage.getItem('customMaterials'))?.weapons || [])];
    } else if (itemId <= 19) { 
        item = items.magic.find(i => i.id === itemId);
        materials = [...baseMaterials.magic, ...(JSON.parse(localStorage.getItem('customMaterials'))?.magic || [])];
    } else { 
        item = items.defense.find(i => i.id === itemId);
        materials = [...baseMaterials.defense, ...(JSON.parse(localStorage.getItem('customMaterials'))?.defense || [])];
    }
    

    const material = materials.find(m => m.id === materialId);
    if (!material) return;
    
  
    const const finalDamage = calculateFinalDamage(item.damage, material.damage);
    const const finalWeight = calculateFinalWeight(item.weight, material.weight);
    const const finalValue = calculateFinalValue(item.value, material.value);
    

    card.querySelector('.final-damage').textContent = finalDamage;
    card.querySelector('.final-weight').textContent = finalWeight;
    card.querySelector('.final-value').textContent = finalValue;
    
    finalAttributes.classList.remove('hidden');
}


function addNewMaterial(existingMaterials) {
    const form = document.getElementById('add-material-form');
    const category = document.getElementById('material-category').value;
    
  
    const newMaterial = {
        id: Date.now(), // Use timestamp as unique ID
        name: document.getElementById('material-name').value,
        damage: document.getElementById('material-damage').value || '+0',
        weight: document.getElementById('material-weight').value || '+0',
        value: document.getElementById('material-value').value || '+0',
        description: document.getElementById('material-description').value || 'Sem descrição.'
    };
    

    if (!existingMaterials[category]) {
        existingMaterials[category] = [];
    }
    existingMaterials[category].push(newMaterial);
    

    const customMaterials = JSON.parse(localStorage.getItem('customMaterials')) || { weapons: [], defense: [], magic: [] };
    customMaterials[category].push(newMaterial);
    localStorage.setItem('customMaterials', JSON.stringify(customMaterials));
    

    renderItems('weapons', items.weapons, [...baseMaterials.weapons, ...customMaterials.weapons]);
    renderItems('magic', items.magic, [...baseMaterials.magic, ...customMaterials.magic]);
    renderItems('defense', items.defense, [...baseMaterials.defense, ...customMaterials.defense]);
    renderMaterials({
        weapons: [...baseMaterials.weapons, ...customMaterials.weapons],
        defense: [...baseMaterials.defense, ...customMaterials.defense],
        magic: [...baseMaterials.magic, ...customMaterials.magic]
    });
    
    
    form.reset();
    
    
    alert(`Material "${newMaterial.name}" adicionado com sucesso à categoria ${getCategoryName(category)}!`);
}


function getCategoryName(categoryKey) {
    switch(categoryKey) {
        case 'weapons': return 'Armas';
        case 'defense': return 'Armaduras';
        case 'magic': return 'Mágicos';
        default: return categoryKey;
    }
}
